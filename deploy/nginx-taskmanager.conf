# /etc/nginx/conf.d/taskmanager.conf
# Streamlit dùng WebSocket nên bắt buộc có các dòng Upgrade/Connection.
# Thay giao.example.vn và đường dẫn chứng chỉ bằng giá trị thật.
server {
    listen 80;
    server_name giao.example.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name giao.example.vn;

    ssl_certificate     /etc/ssl/certs/giao.example.vn.crt;
    ssl_certificate_key /etc/ssl/private/giao.example.vn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
